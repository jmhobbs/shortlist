<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <!-- <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'"> -->
    <title>Shortlist</title>
<style>
  * {
    font-family: 'Source Code Pro', monospace;
  }
  ol {
    list-style-type: none;
    padding: 0;
    margin: 0;
  }
  li {
    padding: 0.5em 0.75em;
    margin: 0.5em 0;
    background: whitesmoke;
  }
  .drop-indicator {
    height: 3px;
    margin: 0.5em 0;
    background: #0464ff;
    border-radius: 2px;
  }
  li button {
    float: right;
    background: none;
    border: none;
    cursor: pointer;
  }
  li#new {
    position: relative;
    cursor: text;
  }
  li#new span {
    position: absolute;
    color: #888;
  }
  .dragging {
    opacity: 0.75;
  }
  /* drag handle */
  li img {
    width: 20px;
    height: 20px;
    float: left;
    margin-right: 10px;
    cursor: grab;
  }
  li img:active {
    cursor: grabbing;
  }
  /* editable area */
  li div {
    margin-left: 30px;
    margin-right: 30px;
    cursor: text;
  }
  li#new div {
    margin-left: 0;
    margin-right: 0;
  }
</style>
  </head>
  <body>
    <ol>
      <li id="new"><span>New Item</span><div contenteditable="true"></div></li>
    </ol>
    <script>
      window.electron = window.electron || {
        sync: (items) => {
          console.log('ipc sync:', items);
        },
        close: () => {
          console.log('ipc close');
        },
        next: (cb) => {
          console.log('ipc next');
          window.electron.nextCb = cb;
        },
        setShortlist: (cb) => {
          console.log('ipc setShortlist');
          window.electron.setShortlistCb = cb;
        }
      };

      const list = document.querySelector('ol');
      let dragging = null;
      let originalNextSibling = null;
      const dropIndicator = document.createElement('div');
      dropIndicator.className = 'drop-indicator';

      function makeListItem(text) {
        const item = document.createElement('li');

        const handle = document.createElement('img');
        handle.src = 'handle.svg';
        handle.draggable = true;
        item.appendChild(handle);

        const button = document.createElement('button');
        button.innerText = '🗑';
        item.appendChild(button);

        const div = document.createElement('div');
        div.contentEditable = true;
        div.innerText = text;
        item.appendChild(div);

        return item;
      }

      function maybeInsertNewItem(evt) {
        if(evt.target.innerText === '') {
          return false;
        }
        list.insertBefore(
          makeListItem(evt.target.innerText),
          list.querySelector('#new').nextSibling
        );
        evt.target.innerHTML = '';
        return true;
      }

      document.querySelector("#new div").addEventListener('keypress', (evt) => {
        if(evt.key === 'Enter') {
          evt.preventDefault();
          evt.target.blur();
        }
      });
      document.querySelector("#new div").addEventListener('focusin', (evt) => {
        document.querySelector("#new span").style.display = 'none';
      });
      document.querySelector("#new div").addEventListener('keydown', (evt) => {
        if(evt.key === 'Escape') {
          evt.preventDefault();
          evt.target.innerHTML = '';
          evt.target.blur();
        }
      });
      document.querySelector("#new div").addEventListener('focusout', (evt) => {
        maybeInsertNewItem(evt) && sync();
        document.querySelector("#new span").style.display = 'inline-block';
      });

      function sync() {
        const items = [...list.querySelectorAll("li:not(#new) > div")].map(item => item.innerText);
        window.electron.sync(items);
      }

      function placeCaretAtEnd(el) {
        el.focus();
        const range = document.createRange();
        range.selectNodeContents(el);
        range.collapse(false);
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
      }

      list.addEventListener('click', (evt) => {
        if(evt.target.tagName === 'BUTTON') {
          evt.preventDefault();
          evt.target.parentElement.remove();
          sync();
          return;
        }
        if(evt.target.tagName === 'IMG') {
          return;
        }
        const li = evt.target.closest('li');
        if(!li) {
          return;
        }
        const div = li.querySelector('div');
        if(evt.target !== div) {
          placeCaretAtEnd(div);
        }
      });

      list.addEventListener('focusout', (evt) => {
        // no sync if we are clicking the button, exiting the new item, or mid-drag
        if(
          evt.target.tagName !== 'DIV' ||
          evt.target.parentElement.id === "new" ||
          evt.target.parentElement.classList.contains('dragging')
        ) {
          return;
        }
        sync();
      });

      list.addEventListener('dragstart', event => {
        dragging = event.target.parentElement;
        dragging.classList.add('dragging');
        originalNextSibling = dragging.nextElementSibling;
        const rect = dragging.getBoundingClientRect();
        event.dataTransfer.effectAllowed = 'move';
        event.dataTransfer.setDragImage(dragging, event.clientX - rect.left, event.clientY - rect.top);
        list.insertBefore(dropIndicator, originalNextSibling);
      });

      list.addEventListener('dragend', event => {
        if (dropIndicator.parentElement) {
          list.insertBefore(dragging, dropIndicator);
          dropIndicator.remove();
        }
        dragging.classList.remove('dragging');
        dragging = null
        originalNextSibling = null;
        sync();
      });

      list.addEventListener('dragover', event => {
        event.preventDefault();
        const afterElement = getDragAfterElement(list, event.clientY);
        if (afterElement === originalNextSibling) {
          dropIndicator.remove();
        } else if (afterElement == null) {
          list.appendChild(dropIndicator);
        } else {
          list.insertBefore(dropIndicator, afterElement);
        }
      });

      function getDragAfterElement(list, y) {
        const draggableElements = [...list.querySelectorAll('li:not(#new):not(.dragging)')];
        return draggableElements.reduce((closest, child) => {
          const box = child.getBoundingClientRect();
          const offset = y - box.top - box.height / 2;
          if (offset < 0 && offset > closest.offset) {
            return { offset: offset, element: child };
          } else {
            return closest;
          }
        }, { offset: Number.NEGATIVE_INFINITY }).element;
      }

      window.electron.setShortlist((items) => {
        items.reverse().forEach((item) => {
          list.insertBefore(makeListItem(item), list.querySelector('#new').nextSibling);
        });
      });

      window.electron.next(() => {
        const button = list.querySelector("li:nth-child(2) button");
        if(button) { button.click(); }
      });
    </script>
  </body>
</html>
